<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Selamat Datang - Pameran Digital Integriti</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #060911;
      color: #f8fafc;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
      position: relative;
      perspective: 1000px;
    }

    /* Particle Canvas Background */
    #particles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient Cursor Glow (GPU Accelerated) */
    .cursor-glow {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(129, 140, 248, 0.05) 50%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    /* Floating Card Stage Container */
    .card-stage {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: center;
    }

    /* Welcome Card Styling */
    .welcome-card {
      position: relative;
      width: 100%;
      padding: 40px 28px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);
      text-align: center;
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      animation: floatIdle 5s ease-in-out infinite alternate, fadeInUp 0.8s ease-out;
      will-change: transform;
    }

    @keyframes floatIdle {
      0% { transform: translateY(0px) rotateX(0deg); }
      100% { transform: translateY(-10px) rotateX(2deg); }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 22px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
      animation: blink 1.5s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .welcome-card h1 {
      font-size: 1.85rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 70%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    .welcome-card p {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Energetic Cyber Button */
    .enter-btn {
      position: relative;
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      color: #0f172a;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      padding: 16px 32px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      overflow: hidden;
    }

    .enter-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.7);
    }

    .enter-btn:active {
      transform: scale(0.96);
    }

    /* Light Sheen Sweep */
    .enter-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      animation: sweep 3.5s infinite;
    }

    @keyframes sweep {
      0% { left: -60%; }
      20% { left: 120%; }
      100% { left: 120%; }
    }

    .arrow-icon {
      font-size: 1.1rem;
      transition: transform 0.2s ease;
    }

    .enter-btn:hover .arrow-icon {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <!-- Background Layer -->
  <canvas id="particles-canvas"></canvas>
  <div class="cursor-glow" id="glow"></div>

  <!-- Main Card Stage -->
  <div class="card-stage">
    <div class="welcome-card" id="card">
      <span class="badge">
        <span class="badge-dot"></span>
        Program Integriti Mahasiswa
      </span>
      <h1>PAMERAN DIGITAL INTEGRITI</h1>
      <p>Terokai Pameran Anti Rasuah yang kami buat khas untuk Program ini!</p>
      
      <a href="exhibition.html" class="enter-btn" id="enterBtn">
        <span>MASUK GALERI 3D</span>
        <span class="arrow-icon">➔</span>
      </a>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. FAST CANVAS PARTICLES
    // -------------------------------------------------------------
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedY = Math.random() * -0.6 - 0.2;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.6 + 0.2;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(56, 189, 248, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 45; i++) particles.push(new Particle());

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // -------------------------------------------------------------
    // 2. MOUSE/TOUCH INTERACTION (3D Tilt & Ambient Glow)
    // -------------------------------------------------------------
    const card = document.getElementById('card');
    const glow = document.getElementById('glow');

    window.addEventListener('mousemove', (e) => {
      // Glow Follows Cursor
      glow.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;

      // Subtle 3D Card Tilt
      const rect = card.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      const rotateX = ((e.clientY - centerY) / (rect.height / 2)) * -8;
      const rotateY = ((e.clientX - centerX) / (rect.width / 2)) * 8;

      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    // Reset Tilt when Mouse Leaves
    document.addEventListener('mouseleave', () => {
      card.style.transform = `rotateX(0deg) rotateY(0deg)`;
    });

    // -------------------------------------------------------------
    // 3. ZERO-LAG AUDIO SYNTHESIZER
    // -------------------------------------------------------------
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    document.getElementById('enterBtn').addEventListener('click', function(e) {
      e.preventDefault();
      const target = this.href;

      if (!audioCtx) audioCtx = new AudioContext();

      // Synthesize quick futuristic click
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.15);

      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);

      setTimeout(() => {
        window.location.href = target;
      }, 120);
    });
  </script>
</body>
</html>
